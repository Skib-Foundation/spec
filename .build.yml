submitter:
  git.sr.ht:
    enabled: true
    allow-refs:
      - refs/heads/master
      - "refs/tags/*"

image: nixos/latest
packages:
  - nixos.typst
  - nixos.openssh
sources:
  - https://git.sr.ht/~skib/spec
secrets:
  - 4acc6b23-a7dc-41ff-8f7d-f51f4dd9d468
tasks:
  - build: |
      cd spec
      typst c index.typ --format html --features html
  - deploy: |
      echo "skib.foundation ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIPfvieXBaUU9lydZ0ZB3KF1XryJ4Au1+ZWJNIjPT002u" >> ~/.ssh/known_hosts

      cd spec
      scp index.html root@skib.foundation:/var/www/html/index.html
      scp style.css root@skib.foundation:/var/www/html/style.css
